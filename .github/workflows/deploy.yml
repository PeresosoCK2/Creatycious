name: CI/CD — Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build images and push to registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/creatycios-backend:latest
          context: ./backend
          file: ./backend/Dockerfile
      - name: Build & push frontend
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/creatycios-frontend:latest
          context: ./frontend
          file: ./frontend/Dockerfile

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Wait a few seconds
        run: sleep 5
      - name: Deploy via SSH (pull images & docker-compose)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            set -euo pipefail
            cd /opt/creatycios
            docker compose pull
            docker compose up -d
            if ! docker compose exec -T nginx nginx -s reload; then
              echo "WARNING: nginx reload failed"
              docker compose exec -T nginx nginx -t
              exit 1
            fi
